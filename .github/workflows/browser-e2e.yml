name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run isolated Compose journey
        run: >-
          docker compose -p enterprise-rag-browser-e2e
          -f infra/compose/compose.e2e.yml
          up --build --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove isolated Compose resources
        if: always()
        run: >-
          docker compose -p enterprise-rag-browser-e2e
          -f infra/compose/compose.e2e.yml
          down --volumes --remove-orphans
