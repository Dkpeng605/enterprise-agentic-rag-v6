name: Backend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://enterprise_rag:enterprise_rag@127.0.0.1:5432/enterprise_rag_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enterprise_rag_test
          POSTGRES_USER: enterprise_rag
          POSTGRES_PASSWORD: enterprise_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_rag -d enterprise_rag_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install PDF and OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim

      - name: Install locked dependencies
        run: uv sync --project backend --locked

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check src tests migrations

      - name: Type-check backend
        working-directory: backend
        run: uv run mypy src tests migrations

      - name: Test backend
        working-directory: backend
        run: uv run pytest -q

      - name: Build backend package
        run: uv build --project backend
