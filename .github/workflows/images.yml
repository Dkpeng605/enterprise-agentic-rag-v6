name: Production images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish-production-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_VERSION: "0.1.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize GHCR namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/enterprise-agentic-rag-backend:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/enterprise-agentic-rag-frontend:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production

      - name: Print immutable image references
        run: |
          echo "${IMAGE_NAMESPACE}/enterprise-agentic-rag-backend:${GITHUB_SHA}"
          echo "${IMAGE_NAMESPACE}/enterprise-agentic-rag-frontend:${GITHUB_SHA}"
