app:
  environment: development
  public_base_url: http://localhost:8000

providers:
  llm: mock
  reranker: local_cross_encoder
  vision: none
  sparse_encoder: hashing_lexical

ingestion:
  object_store_root: data/runtime/object-store
  pdf_ocr_min_chars: 20
  pdf_render_scale: 2.5
  pdf_ocr_languages: [chi_sim, eng]
  spreadsheet_rows_per_root: 60
  csv_fallback_encoding: null
  embedding_batch_size: 32
  embedding_batch_tokens: 8192
  embedding_dimension: 384
  embedding_timeout_seconds: 20.0
  embedding_max_retries: 2

deep:
  low_threshold: 0.45
  high_threshold: 0.80
